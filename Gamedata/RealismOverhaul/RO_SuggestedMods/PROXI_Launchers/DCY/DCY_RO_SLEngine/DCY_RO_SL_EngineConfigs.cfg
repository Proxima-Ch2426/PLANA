@PART[ROE-DCYseaLevel-PROXIlaunchers]:FOR[RealismOverhaulEngines]
{
    @title = DCY Sea Level Engine
    @manufacturer = Mcdonnell Douglas
    @description = A powerful hydrolox engine for sea-level and mid-altitude operations.

    %specLevel = operational

    @MODULE[ModuleEngines*]
    {
        %EngineType = LiquidFuel
    }

    MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		origMass = 1.8
		modded = false
		configuration = DCY-SL-Phase-I
		
		CONFIG 
		{
			name = DCY-SL-Phase-I
			description = Phase I sea-level engine.
			minThrust = 110
			maxThrust = 1130 //1052 ASL

			PROPELLANT //Based of the SSME
			{
				name = LqdHydrogen
				ratio = 0.7276
				DrawGauge = True
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.2724
			}
			atmosphereCurve //Slightly lower ISP due to cost savings
			{
				key = 0 435 
				key = 1 405
			}
			massMult = 1.0
			
			%ullage = True
			%pressureFed = False
			%ignitions = 25 
			%IGNITOR_RESOURCE
			{
				%name = ElectricCharge
				%amount = 0.5
			}

			TESTFLIGHT:NEEDS[TestLite|TestFlight] //basically the same as the rs25
			{
				testedBurnTime = 4615
				ratedBurnTime = 480
				overburnPenalty = 1.5
				safeOverburn = true

				thrustModifier
				{
					key = 0.00 0.05 0 0
					key = 1.00 1.00 3 3
				}

				ignitionReliabilityStart = 0.954918
				ignitionReliabilityEnd = 0.990984
				cycleReliabilityStart = 0.971311
				cycleReliabilityEnd = 0.994262
				ignitionDynPresFailMultiplier = 7.0
			}
		}
		CONFIG
		{
			name = DCY-SL-Phase-II
			description = Phase II sea-level engine.
			minThrust = 110
			maxThrust = 1243 //110% thrust

			PROPELLANT //Based of the SSME
			{
				name = LqdHydrogen
				ratio = 0.7276
				DrawGauge = True
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.2724
			}
			atmosphereCurve
			{
				key = 0 445 
				key = 1 415
			}
			massMult = 1.05
			
			%ullage = True
			%pressureFed = False
			%ignitions = 25 
			%IGNITOR_RESOURCE
			{
				%name = ElectricCharge
				%amount = 0.5
			}

			TESTFLIGHT:NEEDS[TestLite|TestFlight] //basically the same as the rs25
			{
				testedBurnTime = 4615
				ratedBurnTime = 480
				overburnPenalty = 1.5
				safeOverburn = true

				thrustModifier
				{
					key = 0.00 0.05 0 0
					key = 1.00 1.00 3 3
				}

				ignitionReliabilityStart = 0.975000
				ignitionReliabilityEnd = 0.996053
				cycleReliabilityStart = 0.975000
				cycleReliabilityEnd = 0.999211
				ignitionDynPresFailMultiplier = 7.0
			}
		}
	}
}