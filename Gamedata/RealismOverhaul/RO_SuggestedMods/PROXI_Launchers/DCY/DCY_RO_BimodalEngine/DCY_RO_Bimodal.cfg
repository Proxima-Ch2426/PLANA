PART:NEEDS[RealismOverhaul]
{
	module = Part
	name = ROE-DCYbimodal-PROXIlaunchers				// Naming Convention: ROE-NameOfEngine-Mod
	author = Proxidesuwa
	
	category = Engine
	subcategory = 0
	RSSROConfig = true
	RP0conf = true
	TechRequired = hydrolox1992
	
	crashTolerance = 10
	maxTemp = 900
	skinTemp = 3000
	fuelCrossfeed = true
	breakingForce = 10000
	breakingTorque = 10000
	
	//  ============================================================================
	//	Update Below
	//  ============================================================================
	
	MODEL
	{
		// All assets stored in ROEngines/Assets/MOD/
		// The final part of the name is the .MU file without a file extension
		model = PROXI_Launchers/Parts/DCY/Engines_V2/DCY_VACengine_V2
		
		// Set the scale (higher or lower) to go from KSP size to RO size
		scale = 1,1,1
	}
	
	scale = 1.0
	rescaleFactor = 1.0
	
	NODE
	{
	name = node_top
	transform = node_top
	size = 1
	method = FIXED_JOINT
	}
	NODE
	{
	name = node_bottom
	transform = node_bottom
	size = 1
	method = FIXED_JOINT
	}
	NODE
	{
	name = node_mount
	transform = node_mount
	size = 1
	method = FIXED_JOINT
	}
	
	// stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	// These shouldn't really be changed unless you have good reason
	attachRules = 1,1,1,0,0	
	
	// Add the title, Manufacturer and Description, but to be honest, these are
	// not that important
	title = DCY Bimodal Engine
	manufacturer = McDonnell Douglas
	description = A pain in the ass.
	
	// Add good tags
	tags = dcy engine rocket mcdonnell douglas plana
	
	// engineType is important, this is the Global Engine Config that this engine uses
	engineType = DCYbimodal
	stagingIcon = LIQUID_ENGINE			// Or SOLID_BOOSTER
	stageOffset = 1			// Always 1
    childStageOffset = 1	// Always 1
	
	// Leave this section, we set this in RP-1
	cost = 20000
	entryCost = 115000
	
	
	// This is going to be the one that looks the most strange
	// The way the global engine configs work, ALL we need is the name of the
	// thrustVectorTransformName from the ModuleEngines*
	// NOTHING else is important, no matter what you see from the other configs
	// that you will come across in RO
	MODULE
	{
		name = ModuleEnginesRF
		thrustVectorTransformName = thrustTransform
	}
	
	// There will usually be one in the config, overwrite this
	MODULE
    	{
        name = FXModuleThrottleEffects
        fxModuleNames = heatColor
        responseSpeed = 1.0
        dependOnEngineState = True
        dependOnThrottle = True
	preferMultiMode = True
    	}

	MODULE
    	{
        name = FXModuleThrottleEffects
        fxModuleNames = throttleColor
        responseSpeed = 1.0
        dependOnEngineState = True
        dependOnThrottle = True
	preferMultiMode = True
    	}

        MODULE
   	{
        name = ModuleColorChanger
        moduleID = heatColor
        animRate = 0.25
        shaderProperty = _EmissiveColor
	excludedRenderer = DCY_SLcore
        toggleInEditor = false
        toggleInFlight = false
        	redCurve
        	{
          	key = 1 1 1 1
          	key = 1 1 1 1
        	}
       	 	greenCurve
        	{
          	key = 0 0 1 1
          	key = 1 1 1 1
        	}
        	blueCurve
        	{
          	key = 0 0 1 1
          	key = 1 1 1 1
        	}
        	alphaCurve
        	{
          	key = 0 0 1 1
          	key = 1 1 1 1
        	}
   	}
	
	MODULE
   	{
        name = ModuleColorChanger
        moduleID = throttleColor
        animRate = 1
        shaderProperty = _TintColor
	excludedRenderer = DCY_SLcore
        toggleInEditor = false
        toggleInFlight = false
        	redCurve
        	{
          	key = 0 0
          	key = 1 1
        	}
       	 	greenCurve
        	{
          	key = 0 0
          	key = 1 1
        	}
        	blueCurve
        	{
          	key = 0 0
          	key = 1 1
        	}
        	alphaCurve
        	{
          	key = 0 0
          	key = 1 1
        	}
   	}
	
	// Add this when it is proper
	MODULE
	{
		name = ModuleGimbal
		gimbalResponseSpeed = 16
		useGimbalResponseSpeed = true
		gimbalTransformName = gimbal
		gimbalRange = 10
	}
	
	MODULE
	{
		name = ModuleAdvancedLookAtConstraint //REQUIRES DEPLOYABLENENGINES
		CONSTRAINLOOKFX
		{
		targetName = ActuatorX_Gimbal
		rotatorsName = ActuatorX_Static
		}
		CONSTRAINLOOKFX
		{
		targetName = ActuatorX_Static
		rotatorsName = ActuatorX_Gimbal
		}
		CONSTRAINLOOKFX
		{
		targetName = ActuatorY_Gimbal
		rotatorsName = ActuatorY_Static
		}
		CONSTRAINLOOKFX
		{
		targetName = ActuatorY_Static
		rotatorsName = ActuatorY_Gimbal
		}
	}
	
	// Every engine should have one of these
	MODULE
	{
		name = ModuleSurfaceFX
		thrustProviderModuleIndex = 0
		fxMax = 0.5
		maxDistance = 30
		falloff = 1.5
		thrustTransformName = thrustTransform
	}
	
    //Mount switch im losing my sanity
    MODULE
	{
		name = ModuleB9PartSwitch
		switcherDescription = DCY VAC Engine Mount
		moduleID = DCYengineMount_VAC
		affectDragCubes = true
		affectFARVoxels = true

		SUBTYPE
		{
		name = DCY_VAC_Base
		title = No mount
		defaultSubtypePriority = 1
		}
		SUBTYPE
		{
		name = DCY_VAC_StockMount
		title = Space Shuttle Style
		defaultSubtypePriority = 0
		transform = StockMountTransform
		}
		SUBTYPE
		{
		name = DCY_VAC_ThermalBlanket
		title = Thermal Blanket
		defaultSubtypePriority = 0
		transform = Blanket_Mount
		}
	}
}