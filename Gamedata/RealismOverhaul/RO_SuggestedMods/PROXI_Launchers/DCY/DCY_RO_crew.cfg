@PART[PROXI-DCY-crewBay]:AFTER[zzzRealismOverhaul]
{
	%TechRequired = improvedSpaceplanes
	@mass = 0.1
	@title = DCY Crew Bay
	@description = A crew bay for 2 people, capable of lasting about 17 days in orbit. <b><color=green>From ProximaLaunchers</color></b>

	@CoMOffset = 3.0, 0.0, 0.0

	!RESOURCE[ElectricCharge]
	{
	
	}
	!MODULE[ModuleReactionWheel*],*{}

	@MODULE[ModuleCommand]
	{
		@RESOURCE[ElectricCharge]
		{
			@rate = 10
		}
	}

	MODULE
	{
		name = ModuleFuelTanks
		volume = 8000
		type = ServiceModule
		basemass = -1
		TANK
		{
			name = LqdHydrogen
			amount = 4500
			maxAmount = 4500
		}
		TANK
		{
			name = LqdOxygen
			amount = 2350
			maxAmount = 2350
		}
		TANK
		{
			name = Food
			amount = 200
			maxAmount = 200
		}

		TANK
		{
			//Fuel cell production
			name = Water
			amount = 100
			maxAmount = 100
		}

		TANK
		{
			//LOX to GOX conversion
			name = Oxygen
			amount = 4000
			maxAmount = 4000
		}

		TANK
		{
			name = Nitrogen
			amount = 49000
			maxAmount = 49000
		}

		TANK
		{
			name = Waste
			amount = 0
			maxAmount = 70
		}

		TANK
		{
			name = WasteWater
			amount = 0
			maxAmount = 250
		}

		TANK
		{
			name = ElectricCharge
			amount = 4000
			maxAmount = 4000
		}
	}
}

@PART[PROXI-DCY-crewBay]:NEEDS[ProfileRealismOverhaul]:AFTER[zzzRealismOverhaul]
{
	MODULE
	{
		name = ProcessController
		resource = _PressureControl
		title = N2 Pressure Controller
		desc = Use <b>Nitrogen</b> to maintain the internal atmosphere at a comfortable pressure.
		capacity = 1.67
		running = true
	}

	MODULE
	{
		name = ProcessController
		resource = _AirPump
		title = Air Pump
		capacity = 1.2
		running = true
	}

	MODULE
	{
		name = ProcessController
		resource = _LOXConverter
		title = LOX to GOX Converter
		capacity = 0.6
		running = true
	}
	
	MODULE
	{
		name = ProcessController
		resource = _FuelCellShuttle
		title = Fuel Cell
		capacity = 21 //Max continuous output
		running = true
	}
	MODULE
	{
		name = ProcessController
		resource = _AdvScrubber
		title = Advanced Vacuum Scrubber
		capacity = 5
		running = true
	}
	@MODULE[ProcessController],*
	{
		@capacity = 5
	}

	
	MODULE
	{
		name = Configure
		title = Processes
		slots = 5

		SETUP
		{
			name = Air Pump
			desc = Pumps external atmosphere into the cabin to maintan internal pressure. Only works in breathable atmospheres
			tech = crewSurvivability

			MODULE
			{
			type = ProcessController
			id_field = resource
			id_value = _AirPump
			}
		}
		SETUP
		{
			name = N2 Pressure Control
			desc = Use <b>Nitrogen</b> to maintain the internal atmosphere at a comfortable pressure.
			tech = earlyLifeSupport

			MODULE
			{
			type = ProcessController
			id_field = resource
			id_value = _PressureControl
			}
		}
		SETUP
		{
			name = LOX to GOX Converter
			desc = Heats <b>LqdOxygen</b> to breathable <b>Oxygen</b>.
			tech = earlyLifeSupport

			MODULE
			{
			type = ProcessController
			id_field = resource
			id_value = _LOXConverter
			}
		}
		SETUP
		{
			name = Fuel Cell
			desc = A fuel cell that combines <b>Liquid Hydrogen</b> and <b>Liquid Oxygen</b>, producing <b>Water</b> as a by-product.
			tech = maturePower

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _FuelCellShuttle
			}
		}
		SETUP
		{
			name = Advanced Vacuum Scrubber
			desc = An advanced dual-bed vacuum-exposing regenerative scrubber that sequesters <b>CarbonDioxide</b> from the internal atmosphere.
			tech = improvedLifeSupport

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _AdvScrubber
			}
		}
	}
}