		}
	}
	MODULE
	{
		name = ModuleB9PartSwitch
		switcherDescription = Pumps
		moduleID = pumpToggle
		affectDragCubes = false
		affectFARVoxels = false
	
		SUBTYPE
		{
		name = DCY_pumps_enabled
		title = Pumps enabled
		descriptionSummary = 
		descriptionDetail = 
		defaultSubtypePriority = 1
		transform = 000_PumpTransform
		}

		SUBTYPE
		{
		name = DCY_pumps_disabled
		title = Pumps disabled
		descriptionSummary = 
		descriptionDetail = 
		defaultSubtypePriority = 0
		}
	}
	MODULE
	{
		name = ModuleB9PartSwitch
		switcherDescription = Pipes
		moduleID = pipesToggle
		affectDragCubes = false
		affectFARVoxels = false
	
		SUBTYPE
		{
		name = DCY_pipes_enabled
		title = Pipes enabled
		descriptionSummary = 
		descriptionDetail = 
		defaultSubtypePriority = 1
		transform = 000_PipeTransform
		}

		SUBTYPE
		{
		name = DCY_pipes_disabled
		title = Pipes disabled
		descriptionSummary = 
