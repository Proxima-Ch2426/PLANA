		}
	}
	MODULE
	{
		name = ModuleB9PartSwitch
		switcherDescription = Support
		moduleID = supportToggle
		affectDragCubes = false
		affectFARVoxels = false
	
		SUBTYPE
		{
		name = DCY_support_enabled
		title = Supports enabled
		descriptionSummary = 
		descriptionDetail = 
		defaultSubtypePriority = 1
		transform = 000_EngineSupport
		}

		SUBTYPE
		{
		name = DCY_support_disabled
		title = Supports disabled
		descriptionSummary = 
		descriptionDetail = 
		defaultSubtypePriority = 0
		}
	}
	MODULE
	{
		name = ModuleDepthMask
		maskTransform = NozzleDepthMask
	}
}