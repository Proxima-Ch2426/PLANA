@PART[ROE-DCYspike-PROXIlaunchers]:FOR[RealismOverhaulEngines]
{
    @title = DCY Aerospike Engine
    @manufacturer = Mcdonnell Douglas
    @description = A large and expensive altitude-compensating aerospike engine, later proposed for DCY.

    %specLevel = operational

    @MODULE[ModuleEngines*]
    {
        %EngineType = LiquidFuel
    }

    MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		origMass = 14.7
		modded = false
		configuration = DCY-Aerospike-Phase-I
		
		CONFIG 
		{
			name = DCY-Aerospike-Phase-I
			description = Phase I aerospike engine.
			minThrust = 110
			maxThrust = 9544.2 //8401.6 ASL

			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 0.7276
				DrawGauge = True
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.2724
			}
			atmosphereCurve
			{
				key = 0 460 
				key = 1 405
			}
			massMult = 1.0
			
			%ullage = True
			%pressureFed = False
			%ignitions = 25 
			%IGNITOR_RESOURCE
			{
				%name = ElectricCharge
				%amount = 0.5
			}

			TESTFLIGHT:NEEDS[TestLite|TestFlight] //basically the same as the rs25
			{
				testedBurnTime = 4700
				ratedBurnTime = 500
				overburnPenalty = 1.5
				safeOverburn = true

				thrustModifier
				{
					key = 0.00 0.05 0 0
					key = 1.00 1.00 3 3
				}

				ignitionReliabilityStart = 0.954918
				ignitionReliabilityEnd = 0.990984
				cycleReliabilityStart = 0.971311
				cycleReliabilityEnd = 0.994262
				ignitionDynPresFailMultiplier = 7.0
			}
		}
		CONFIG 
		{
			name = DCY-Aerospike-Phase-II
			description = Phase II aerospike engine.
			minThrust = 110
			maxThrust = 10498.62 //110% thrust

			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 0.7276
				DrawGauge = True
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.2724
			}
			atmosphereCurve
			{
				key = 0 460 
				key = 1 425
			}
			massMult = 1.1
			
			%ullage = True
			%pressureFed = False
			%ignitions = 25 
			%IGNITOR_RESOURCE
			{
				%name = ElectricCharge
				%amount = 0.5
			}

			TESTFLIGHT:NEEDS[TestLite|TestFlight] //basically the same as the rs25
			{
				testedBurnTime = 4700
				ratedBurnTime = 500
				overburnPenalty = 1.5
				safeOverburn = true

				thrustModifier
				{
					key = 0.00 0.05 0 0
					key = 1.00 1.00 3 3
				}

				ignitionReliabilityStart = 0.975000
				ignitionReliabilityEnd = 0.996053
				cycleReliabilityStart = 0.975000
				cycleReliabilityEnd = 0.999211
				ignitionDynPresFailMultiplier = 7.0
			}
		}
	}
}