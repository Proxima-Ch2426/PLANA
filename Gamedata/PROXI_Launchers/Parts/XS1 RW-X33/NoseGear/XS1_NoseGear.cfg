				clip = Squad/Sounds/elev_start
				volume = 0 0
				volume = 1 0.5
				pitch = 0.9
			}
		}
	}
	MODEL
	{
		model = PROXI_Launchers/Parts/XS1 RW-X33/NoseGear/XS1_NoseGear
		//scale = 1, 1, 1
	}
	MODULE
	{
		name = KSPWheelBase
		showControls = false
		WHEEL
		{
			colliderName = 0WheelCollider
			radius = 0.2
			mass = 0.1
			travel = 0.2
		}
		loadRating = 24
		minLoadRating = 1
		maxLoadRating = 20
		persistentState = DEPLOYED
		allowScaling = false
		groundHeightOffset = 1
	}
	MODULE
	{
		name = KSPWheelRotation
		wheelMeshName = N-Tires
		rotationAxis = 0, 0, 1
	}

	MODULE
	{
		name = KSPWheelSuspension
		suspensionName = 0SuspensionPivot
		suspensionOffset = -0.2
		suspensionAxis = 0,0,1
	}
	MODULE
	{
		name = KSPWheelBrakes
		maxBrakeTorque = 30
		brakeResponse = 2
	}

	MODULE
	{
		name = KSPWheelDeployment
		animationName = GearExtend
		animationLayer = 1
		tempColliderName = 0SuspensionPivot
		tempColliderOffset = 0.0
		persistentState = STOPPED_START
	}
	MODULE
	{
		name = FXModuleLookAtConstraint			// scissor links
		CONSTRAINLOOKFX
		{
			targetName = 0anchorLower
			rotatorsName = 0linkUpper
		}
		CONSTRAINLOOKFX
		{
			targetName = 0anchorUpper
			rotatorsName = 0linkLower
		}
	}
	MODULE
	{
		name = KSPWheelSteering
		steeringName = 0SteeringPivot
		maxSteeringAngle = 30
		steeringAxis = 0, 0, 1
		steeringResponse = 10
	}
	MODULE
	{
		name = FXModuleConstrainPosition		// match rotation of the upper scissor link to the steered section
		matchRotation = true
		matchPosition = false
		CONSTRAINFX
		{
			targetName = 0SteeringPivot
			moversName = 0SteeringActuator
		}
	}

//TEXTURE SWITCH
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = gearTexture
		switcherDescription = Texture
		switchInFlight = false
		affectDragCubes = false
		affectFARVoxels = false

		SUBTYPE
		{
		name = thermalBlankets
