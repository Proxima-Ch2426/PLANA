			{
			texture = PROXI_Launchers/Parts/XS1 RW-X33/NoseGear/XS1_NoseGear_NRM
			isNormalMap = true
			}
		}

		SUBTYPE
		{
		name = heatTiles
		title = Heat tiles
		descriptionSummary = 
		defaultSubtypePriority = 0
			TEXTURE
			{
			texture = PROXI_Launchers/Parts/XS1 RW-X33/NoseGear/XS1_NoseGear_Alt
			}
			TEXTURE
			{
			texture = PROXI_Launchers/Parts/XS1 RW-X33/NoseGear/XS1_NoseGear_Alt_NRM
			isNormalMap = true
			}
		}
	}
	MODULE
	{
		name = ModuleDepthMask
		maskTransform = DEPTHMASK_NoseGear
	}
