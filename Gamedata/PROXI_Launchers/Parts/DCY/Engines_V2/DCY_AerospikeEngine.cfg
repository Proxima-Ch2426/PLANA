PART
{
	name = PROXI-DCY-Spike
	module = Part
	author = Proxidesuwa
	MODEL
	{
		model = PROXI_Launchers/Parts/DCY/Engines_V2/DCY_AerospikeEngine
	}	
	rescaleFactor = 0.5938

	NODE
	{
	name = node_top
	transform = node_top
	size = 3
	method = FIXED_JOINT
	}
	NODE
	{
	name = node_bottom
	transform = node_bottom
	size = 2
	method = FIXED_JOINT
	}
	NODE
	{
	name = node_extra
	transform = node_extra
	size = 2
	method = FIXED_JOINT
	}
	
	TechRequired = veryHeavyRocketry
	entryCost = 120000
	cost = 120000
	category = Engine
	subcategory = 0

	title = KC-Y Aerospike
	manufacturer = Macdonald Dogless
	description = A highly effiecient engine with atmospheric compensation, also known as an aerospike. Preferbably attached to the bottom of the vehicle.

	attachRules = 1,1,1,1,1
	mass = 10.0
	heatConductivity = 0.06 // half default
	skinInternalConductionMult = 4.0
	emissiveConstant = 0.8 // engine nozzles are good at radiating.
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 22
	breakingForce = 400
	breakingTorque = 400
	maxTemp = 2000 // = 3600
	bulkheadProfiles = srf, size1
	tags = dcy engine rocket KC-Y aerospike plana

	EFFECTS
	{
		running_closed
		{
			AUDIO
			{
				channel = Ship
				clip = sound_rocket_hard
				volume = 0.0 0.0
				volume = 0.05 0.6
				volume = 1.0 1.5
				pitch = 0.0 1.2
				pitch = 1.0 2.0
				loop = true
			}
			MODEL_MULTI_PARTICLE
			{
				//modelName = Squad/FX/ks25_Exhaust
				modelName = Squad/FX/hydroLOXFlame
				transformName = thrustTransform
				emission = 0.0 0.0
				emission = 0.1 0.5
				emission = 1.0 1.0
				speed = 0.0 0.8
				speed = 1.0 1.0
				localPosition = 0, 0, 0.08
			}
		}
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		flameout
		{
			PREFAB_PARTICLE
			{
				prefabName = fx_exhaustSparks_flameout_2
				transformName = thrustTransform
				oneShot = true
			}
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
	}
	MODULE
	{
		name = ModuleEnginesFX
		engineID = DCY_Spike
		runningEffectName = running_closed
		thrustVectorTransformName = thrustTransform
		exhaustDamage = True
		ignitionThreshold = 0.1
		minThrust = 0
		maxThrust = 6600
		heatProduction = 192
		fxOffset = 0, 0, 0
		EngineType = LiquidFuel
		exhaustDamageDistanceOffset = 1.5
		PROPELLANT
		{
			name = LiquidFuel
			ratio = 0.9
			DrawGauge = True
		}
		PROPELLANT
		{
			name = Oxidizer
			ratio = 1.1
		}
		atmosphereCurve
		{
			key = 0 350
			key = 1 290
			key = 12 0.001
		}
	}
	MODULE
    	{
        name = FXModuleThrottleEffects
        fxModuleNames = heatColor
        responseSpeed = 1.0
        dependOnEngineState = True
        dependOnThrottle = True
	preferMultiMode = True
    	}

	MODULE
    	{
        name = FXModuleThrottleEffects
        fxModuleNames = throttleColor
        responseSpeed = 1.0
        dependOnEngineState = True
        dependOnThrottle = True
	preferMultiMode = True
    	}

        MODULE
   	{
        name = ModuleColorChanger
        moduleID = heatColor
        animRate = 0.25
        shaderProperty = _EmissiveColor
	excludedRenderer = DCY_SLcore
        toggleInEditor = false
        toggleInFlight = false
        	redCurve
