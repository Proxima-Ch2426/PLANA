@PART[PROXI-MDRLV-*]:AFTER[zzzRealismOverhaul]
{
	%maxTemp = 923.15
	%skinMaxTemp = 3000
	%skinThermalMassModifier = 0.43613
	%skinInternalConductionMult = 0.0000105
	%skinMassPerArea = 0.815
	%absorptiveConstant = 0.15	
	%emissiveConstant = 0.85
	%thermalMassModifier = 1.0

	@manufacturer = McDonnell Douglas
	
	%RSSROConfig = True
	%RP0conf = True
	
	@rescaleFactor = 1

}
@PART[PROXI-MDRLV-nose]:AFTER[zzzRealismOverhaul]
{
	%TechRequired = advancedSpaceplanes
	@mass = 22.93
	@title = MD RLV Nose
	@description = The nose section of the MD RLV, covered in tiles to protect it during reentry. <b><color=green>From ProximaLaunchers</color></b>

	!RESOURCE[LiquidFuel]
    	{
	
    	}
    	!RESOURCE[Oxidizer]
    	{
	
    	}
	@RESOURCE[ElectricCharge]
	{
		@amount = 100000
		@maxAmount = 100000
	}
	MODULE
	{
		name = AdjustableCoMShifter
		DescentModeCoM = 0, 15.0, 0
	}
    	MODULE
    	{
        	name = ModuleFuelTanks
        	volume = 480053
        	basemass = -1
        	type = Balloon

    	}

	@MODULE[ModuleCommand]
	{
		!RESOURCE,* {}
	}
	!MODULE[ModuleReactionWheel]
	MODULE
	{
		name = ModuleAvionics
		massLimit = 100000.0
		interplanetary = True
		toggleable = true
		disabledkW = 0.1
		enabledkW = 1.3
	}
}
@PART[PROXI-MDRLV-wing]:AFTER[zzzRealismOverhaul]
{
	%TechRequired = advancedSpaceplanes
	@mass = 0.67
	@title = MDRLV Wing
	@description = The wings and landing gear for MD RLV. <b><color=green>From ProximaLaunchers</color></b>
}