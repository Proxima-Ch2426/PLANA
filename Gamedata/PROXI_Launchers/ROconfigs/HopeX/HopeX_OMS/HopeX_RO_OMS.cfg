PART:NEEDS[RealismOverhaul]
{
	module = Part
	name = ROE-HopeXoms-PROXIlaunchers				// Naming Convention: ROE-NameOfEngine-Mod
	author = Proxidesuwa
	
	category = Engine
	subcategory = 0
	RSSROConfig = true
	RP0conf = true
	TechRequired = orbitalRocketry2004
	
	crashTolerance = 10
	maxTemp = 900
	skinTemp = 3000
	fuelCrossfeed = true
	breakingForce = 10000
	breakingTorque = 10000
	
	//  ============================================================================
	//	Update Below
	//  ============================================================================
	
	MODEL
	{
		// All assets stored in ROEngines/Assets/MOD/
		// The final part of the name is the .MU file without a file extension
		model = PROXI_Launchers/Parts/HopeX/EngineV2/HopeX_EngineV2
		
		// Set the scale (higher or lower) to go from KSP size to RO size
		scale = 1,1,1
	}
	
	scale = 1.0
	rescaleFactor = 1.0
	
	NODE
	{
	name = node_down1
	transform = node_down1
	size = 2
	method = FIXED_JOINT
	}
	NODE
	{
	name = node_up1
	transform = node_up1
	size = 2
	method = FIXED_JOINT
	}
	NODE
	{
	name = node_up2
	transform = node_up2
	size = 2
	method = FIXED_JOINT
	}
	
	// stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	// These shouldn't really be changed unless you have good reason
	attachRules = 1,1,1,0,0	
	
	// Add the title, Manufacturer and Description, but to be honest, these are
	// not that important
	title = Hope-X OMS engine
	manufacturer = JAXA
	description = You shouldn't have seen this.
	
	// Add good tags
	tags = hopex engine oms plana
	
	// engineType is important, this is the Global Engine Config that this engine uses
	engineType = HopeXoms
	stagingIcon = LIQUID_ENGINE			// Or SOLID_BOOSTER
	stageOffset = 1			// Always 1
    childStageOffset = 1	// Always 1
	
	// Leave this section, we set this in RP-1
	entryCost = 3000
	cost = 250
	
	
	// This is going to be the one that looks the most strange
	// The way the global engine configs work, ALL we need is the name of the
	// thrustVectorTransformName from the ModuleEngines*
	// NOTHING else is important, no matter what you see from the other configs
	// that you will come across in RO
	MODULE
	{
		name = ModuleEnginesRF
		thrustVectorTransformName = thrustTransform
	}
	
	// There will usually be one in the config, overwrite this
	MODULE
    	{
        name = FXModuleThrottleEffects
        fxModuleNames = heatColor
        responseSpeed = 1.0
        dependOnEngineState = True
        dependOnThrottle = True
	preferMultiMode = True
    	}
        MODULE
   	{
        name = ModuleColorChanger
        moduleID = heatColor
        animRate = 0.25
        shaderProperty = _EmissiveColor
	excludedRenderer = DCY_SLcore
        toggleInEditor = false
        toggleInFlight = false
        	redCurve
        	{
          	key = 1 1 1 1
          	key = 1 1 1 1
        	}
       	 	greenCurve
        	{
          	key = 0 0 1 1
          	key = 1 1 1 1
        	}
        	blueCurve
        	{
          	key = 0 0 1 1
          	key = 1 1 1 1
        	}
        	alphaCurve
        	{
          	key = 0 0 1 1
          	key = 1 1 1 1
        	}
   	}	
	// Add this when it is proper
	MODULE
	{
		name = ModuleGimbal
		gimbalResponseSpeed = 16
		useGimbalResponseSpeed = true
		gimbalTransformName = gimbal
		gimbalRange = 5
	}
	
	MODULE
	{
		name = ModuleAdvancedLookAtConstraint //REQUIRES DEPLOYABLENENGINES
		CONSTRAINLOOKFX
		{
		targetName = GIMBAL_upperX
		rotatorsName = GIMBAL_lowerX
		}
		CONSTRAINLOOKFX
		{
		targetName = GIMBAL_lowerX
		rotatorsName = GIMBAL_upperX
		}
		CONSTRAINLOOKFX
		{
		targetName = GIMBAL_upperY
		rotatorsName = GIMBAL_lowerY
		}
		CONSTRAINLOOKFX
		{
		targetName = GIMBAL_lowerY
		rotatorsName = GIMBAL_upperY
		}
	}
	
	// Every engine should have one of these
	MODULE
	{
		name = ModuleSurfaceFX
		thrustProviderModuleIndex = 0
		fxMax = 0.5
		maxDistance = 30
		falloff = 1.5
		thrustTransformName = thrustTransform
	}
	MODULE
	{
		name = ModuleDepthMask
		maskTransform = DEPTHMASK_nozzle
	}
	MODULE
	{
		name = ModuleB9PartSwitch
		switcherDescription = Engine Mount
		moduleID = HopeX_engineMount
		affectDragCubes = true
		affectFARVoxels = true

		SUBTYPE
		{
		name = HopeXmount_on
		title = On
		defaultSubtypePriority = 1
		transform = Mount
		}
		SUBTYPE
		{
		name = HopeXmount_off
		title = Off
		defaultSubtypePriority = 0
		}
	}
	MODULE //Nozzle switch
	{
		name = ModuleB9PartSwitch
		switcherDescription = Nozzle (auto-switched)
		moduleID = nozzle

		SUBTYPE
		{
		name = No_extension
		transform = fxNozzle
		}
		SUBTYPE
		{
		name = Extension
		transform = NozzleExtension
		}
	}
}

@PART[ROE-HopeXoms-PROXIlaunchers]:AFTER[RealismOverhaulEngines]
{
	@MODULE[ModuleEngineConfigs]
	{
		@CONFIG[HopeX-OMS]
		{
			%LinkB9PSModule[nozzle] {subtype = No_extension}
		}
		@CONFIG[HopeX-OMS-extension]
		{
			%LinkB9PSModule[nozzle] {subtype = Extension}
		}
	}
}