	@title = HOPE-X Cargo Bay
	@description = A cargo bay for transporting cargo. <b><color=green>From ProximaLaunchers</color></b>
}
@PART[PROXI-HopeX-cargo_v2]:AFTER[zzzRealismOverhaul]
{
	%TechRequired = advancedSpaceplanes
	@mass = 0.2
	@title = HOPE-X Cargo Container
	@description = A cargo container that can carry resupplies to a space station. Place this last to make it easier to attach the service module.<b><color=green>From ProximaLaunchers</color></b>

    	MODULE
    	{
        	name = ModuleFuelTanks
        	volume = 5000
        	basemass = -1
        	type = ServiceModule
    	}
}
