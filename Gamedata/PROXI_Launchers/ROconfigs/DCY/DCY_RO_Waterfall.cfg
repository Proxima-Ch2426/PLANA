@PART[ROE-DCYspike-PROXIlaunchers]:NEEDS[Waterfall]:AFTER[RealismOverhaul]
{
    ROWaterfall
    {
        template = waterfall-hydrolox-lower-1
        audio = pump-fed-medium-1
        transform = zzz_FX_DCY_AerospikeFull
        position = 0,0,-0.022
        rotation = 0,0,0
        scale = 6.2,6.2,1.68
    }
  !MODULE[ModuleB9PartSwitch]:HAS[#moduleID[DCYSpikeplumeSwitch]], *{}
  MODULE
  {
    name = ModuleB9PartSwitch
    moduleID = RO_DCYSpikeplumeSwitch
    switcherDescription = RO Plumes
    affectDragCubes = False
    affectFARVoxels = False
    switchInFlight = True

    SUBTYPE
    {
      name = RO_default
      title = Full Plume
      descriptionSummary = Full aerospike plume
      descriptionDetail = 
    }
    SUBTYPE
    {
      name = RO_indiv
      title = Individual Plumes
      descriptionSummary = Individual nozzle plumes
      descriptionDetail = 
      MODULE
      {
        IDENTIFIER {name = ModuleWaterfallFX}
        DATA
        {
          TEMPLATE
          {
            name = plume
            templateName = waterfall-hydrolox-lower-4
            overrideParentTransform = FX_DCY_AerospikeIndiv
            scale = 0.168,0.168,0.168
            rotation = 0,0,0
            position = 0,0,0
          }
        }
      }
    }
  }
}

@PART[ROE-DCYseaLevel-PROXIlaunchers]:NEEDS[Waterfall]:AFTER[RealismOverhaul]
{

    ROWaterfall
    {
        template = waterfall-hydrolox-lower-4
        audio = pump-fed-medium-1
        transform = thrustTransform
        position = 0,0,0
        rotation = 0,0,0
        scale = 1.2,1.2,1.2
    }
}

@PART[ROE-DCYbimodal-PROXIlaunchers]:BEFORE[ROWaterfall]:NEEDS[Waterfall]
{
    ROWaterfall
    {
        template = waterfall-hydrolox-lower-4
        audio = pump-fed-medium-1
        transform = fxTransformVAC
        position = 0,0,0
        rotation = 0,0,0
        scale = 1.2,1.2,1.2

        MainPlumeVariant:NEEDS[B9PartSwitch]
        {
            name = hydroloxUpper
            template = waterfall-hydrolox-upper-1
            transform = fxTransformVAC
            position = 0,0,0
            rotation  = 0,0,0
            scale = 1.9,1.9,1.9
        }
    }

    @MODULE[ModuleBimodalEngineConfigs]:NEEDS[B9PartSwitch]
    {
        @CONFIG,*
        {
            @SUBCONFIG,*
            {
                LinkB9PSModule
                {
                    name = rowaterfallMainPlumeSwitch
                    subtype = hydroloxUpper
                }
            }
        }
    }
}