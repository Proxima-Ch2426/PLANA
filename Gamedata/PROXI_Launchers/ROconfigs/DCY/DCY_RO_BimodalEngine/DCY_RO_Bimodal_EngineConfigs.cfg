@PART[ROE-DCYbimodal-PROXIlaunchers]:FOR[RealismOverhaulEngines]
{
    @title = DCY Bimodal Engine
    @manufacturer = Mcdonnell Douglas
    @description = A bimodal hydrolox engine for sea-level and vacuum operations, proposed for the DCY.

    %specLevel = operational

    @MODULE[ModuleEngines*]
    {
        %EngineType = LiquidFuel
    }

    MODULE
    {
        name = ModuleBimodalEngineConfigs
        type = ModuleEngines
        configuration = DCY_bimodal_P1
        origMass = 2.2
        modded = false
		animationName = NozzleExtend
        CONFIG
        {
            name = DCY_bimodal_P1
            description = Phase I
            specLevel = operational
            minThrust = 110
			maxThrust = 1130 //1052 ASL

            PROPELLANT //Based of the SSME
			{
				name = LqdHydrogen
				ratio = 0.7276
				DrawGauge = True
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.2724
			}
			atmosphereCurve //Slightly lower ISP due to cost savings
			{
				key = 0 435 
				key = 1 405
			}
			
			%ullage = True
			%pressureFed = False
			%ignitions = 25 
			%IGNITOR_RESOURCE
			{
				%name = ElectricCharge
				%amount = 0.5
			}
			SUBCONFIG
			{
				name = DCY-bimodal_P1_Extended
				minThrust = 119
				maxThrust = 1195
				
				atmosphereCurve
				{
					key = 0 450
					key = 1 350
				}
			}

			TESTFLIGHT:NEEDS[TestLite|TestFlight] //basically the same as the rs25
			{
				testedBurnTime = 4615
				ratedBurnTime = 480
				overburnPenalty = 1.5
				safeOverburn = true

				thrustModifier
				{
					key = 0.00 0.05 0 0
					key = 1.00 1.00 3 3
				}

				ignitionReliabilityStart = 0.954918
				ignitionReliabilityEnd = 0.990984
				cycleReliabilityStart = 0.971311
				cycleReliabilityEnd = 0.994262
				ignitionDynPresFailMultiplier = 7.0
			}
        }
    }
}