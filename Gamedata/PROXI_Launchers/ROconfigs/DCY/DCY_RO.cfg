@PART[PROXI-DCY-adapter]:AFTER[zzzRealismOverhaul]
{
	%TechRequired = improvedSpaceplanes
	@mass = 1
	@title = DCY Adapter
	@description = An adapter to attach a first stage to the DCY. <b><color=green>From ProximaLaunchers</color></b>

	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[DCYadapter_size]]
	{
		@SUBTYPE[DCY_adapter_6.25]
		{
		@title = 10.5m
		}
		@SUBTYPE[DCY_adapter_7.5]
		{
		@title = 12.5m
		}
	}
