@PART[PROXI-DCY-avionicsV2]:AFTER[zzzRealismOverhaul]
{
	%TechRequired = improvedSpaceplanes
	@mass = 1.1
	@title = DCY Avionics
	@description = The main power and control supply for the vehicle, found at the side of the nose cone. <b><color=green>From ProximaLaunchers</color></b>

	!MODULE[ModuleReactionWheel*],*{}

	%MODULE[ModuleAvionics]
	{
		%massLimit = 750
		%interplanetary = True
	}
}
