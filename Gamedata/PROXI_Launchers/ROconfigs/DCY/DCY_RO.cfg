@PART[PROXI-DCY-*]:AFTER[zzzRealismOverhaul]
{
	%maxTemp = 923.15
	%skinMaxTemp = 3000
	%skinThermalMassModifier = 0.43613
	%skinInternalConductionMult = 0.0000105
	%skinMassPerArea = 0.815
	%absorptiveConstant = 0.15	
	%emissiveConstant = 0.85
	%thermalMassModifier = 1.0

	@manufacturer = McDonnell Douglas
	
	%RSSROConfig = True
	%RP0conf = True
	
	@rescaleFactor = 1

}
@PART[PROXI-DCY-leg]:AFTER[zzzRealismOverhaul]
{
	%TechRequired = improvedSpaceplanes
	@mass = 0.25
	@title = DCY Leg
	@description = The landing legs found at the bottom of the vehicle. <b><color=green>From ProximaLaunchers</color></b>
}
@PART[PROXI-DCY-flap]:AFTER[zzzRealismOverhaul]
{
	%TechRequired = improvedSpaceplanes
	@mass = 3.0
	@title = DCY Flap
	@description = One of five flaps found near the bottom of the vehicle for atmospheric control. <b><color=green>From ProximaLaunchers</color></b>

	@MODULE[ModuleAeroSurface]
	{
		%uncasedTemp = 3000
		%casedTemp = 3000
	}
}
@PART[PROXI-DCY-halfflap]:AFTER[zzzRealismOverhaul]
{
	%TechRequired = improvedSpaceplanes
	@mass = 1.5
	@title = DCY Half Flap
	@description = A half-sized flap to be placed on the earth side of DCY or MD RLV, meant for roll control. <b><color=green>From ProximaLaunchers</color></b>

	@MODULE[ModuleAeroSurface]
	{
		%uncasedTemp = 3000
		%casedTemp = 3000
	}
}
@PART[PROXI-DCY-body]:AFTER[zzzRealismOverhaul]
{
	%TechRequired = improvedSpaceplanes
	@mass = 3.87
	@title = DCY Main Body
	@description = The main body of the DCY containing most of the fuel. <b><color=green>From ProximaLaunchers</color></b>

	!RESOURCE[LiquidFuel]
    	{
	
    	}
    	!RESOURCE[Oxidizer]
    	{
	
    	}
	!RESOURCE[ElectricCharge]
	{
	
	}
    	MODULE
    	{
        	name = ModuleFuelTanks
        	volume = 1205597
        	basemass = -1
        	type = Balloon
    	}
	@MODULE[ModuleRCSFX]
	{
		!PROPELLANT,* {}
		@thrusterPower = 5.0
        	PROPELLANT
        	{
            	name = LqdHydrogen
            	ratio = 0.7631
            	DrawGauge = True
        	}
        	PROPELLANT
        	{
            	name = LqdOxygen
            	ratio = 0.2369
        	}
		enableRoll = True
        	enableYaw = True
        	enablePitch = True
        	enableX = True
        	enableY = True
        	enableZ = True
		@atmosphereCurve
		{
			@key,0 = 0 400
			@key,1 = 1 100
		}
	}
}
