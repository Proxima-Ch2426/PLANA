@PART[PROXI-DCY-Spike]:NEEDS[Waterfall]
{

  !fx_exhaustFlame_blue = DELETE
  !fx_exhaustLight_blue = DELETE
  !fx_smokeTrail_light = DELETE
  !sound_vent_medium = DELETE
  !sound_rocket_hard = DELETE
  !sound_vent_soft = DELETE
  !sound_explosion_low = DELETE
  
  // Removes the Realplume plumes
  !PLUME {}
  
  // Removes the stock effect block, and replace it with one that has no particles
  !EFFECTS {}
  EFFECTS
  {
    engage
    {
      AUDIO
      {
        channel = Ship
        clip = Waterfall/Sounds/KW/sound_liq4
        volume = 0.8
        pitch = 1.0
        loop = false
      }
    }
    disengage
    {
        AUDIO
        {
          channel = Ship
          clip = sound_vent_soft
          volume = 0.8
          pitch = 2.0
          loop = false
        }
    }
    flameout
    {
      AUDIO
      {
        channel = Ship
        clip = sound_explosion_low
        volume = 0.8
        pitch = 2.0
        loop = false
      }
    }
    fx-DCYspike-running
    {
     AUDIO
      {
        channel = Ship
        clip = Waterfall/Sounds/KW/sound_altloop
        volume = 0.0 0.0
        volume = 1.0 0.8
        pitch = 0.0 1.0
        pitch = 1.0 1.0
        loop = true
      }
    }
  }
  
  @MODULE[ModuleEngines*]
  {
    @name = ModuleEnginesFX
	%runningEffectName = fx-DCYspike-running
	!powerEffectName
  }
  
  MODULE
  {
    name = ModuleWaterfallFX
    moduleID = DCYaerospikeFX

	CONTROLLER
	{
		name = atmosphereDepth
		linkedTo = atmosphere_density
	}
	CONTROLLER
	{
		name = throttle
		linkedTo = throttle
		engineID = KS25
		responseRateUp = 0.03
		responseRateDown = 0.2
	}
	
    TEMPLATE
    {
      name = plume
      templateName = waterfall-hydrolox-lower-1
      overrideParentTransform = zzz_FX_DCY_AerospikeFull
      scale = 3.65,3.65,1
      rotation = 0,0,0
      position = 0,0.0,-0.022
    }
  }
  
  MODULE
  {
  	name = ModuleB9PartSwitch
	moduleID = DCYSpikeplumeSwitch
	switcherDescription = Plume
	switcherDescriptionPlural = Plumes
	affectDragCubes = false
	affectFARVoxels = false
	switchInFlight = true
	
	SUBTYPE
	{ 
		name = default
		title = Full Plume
		descriptionSummary = Full aerospike plume
		descriptionDetail = 
	}
    	SUBTYPE
    	{
        	name = indiv
		title = Individual Plumes
		descriptionSummary = Individual nozzle plumes
		descriptionDetail = 

           MODULE
           {
            	IDENTIFIER { name = ModuleWaterfallFX }
            	DATA
            	{
                	TEMPLATE
                	{
                	name = plume
			templateName = waterfall-hydrolox-lower-4
			overrideParentTransform = FX_DCY_AerospikeIndiv
			scale = 0.1,0.1,0.1
			rotation = 0,0,0
			position = 0,0.0,0
                	}
            	}
           }
    	}
  }
}
