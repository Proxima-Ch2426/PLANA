@PART[PROXI-SC-body]:NEEDS[Waterfall]
{
	!EFFECTS {}
  EFFECTS
  {
    running
    {
      AUDIO_MULTI_POOL
      {
        channel = Ship
        transformName = RCSthruster
        clip = Waterfall/Sounds/Beale_Sounds/Sound_RocketStentor
        volume = 0.0 0.0
        volume = 0.1 0.0
        volume = 0.5 0.04
        volume = 1.0 0.15
        pitch = 1.5
        loop = true
      }
    }
  }

  MODULE
  {
    name = ModuleWaterfallFX
    moduleID = SC_RCS
    engineID = basicEngine

    	CONTROLLER
    	{
      	name = atmosphereDepth
      	linkedTo = atmosphere_density
    	}
    	CONTROLLER
    	{
      	name = rcs
      	linkedTo = rcs
    	}
 	CONTROLLER
	{
	name = R1
	linkedTo = random
	noiseType = perlin
	scale = 1
	minimum = 0
	speed = 12
	seed = 1
	}
	
    TEMPLATE
    {
      templateName = RCS-JET
      overrideParentTransform = RCSthruster
	  position = 0,0,0
	  rotation = 0, 0, 180
	  scale = 1.5, 1.5, 1.5
    }
  }
}
@PART[PROXI-SC-AirEngine]:NEEDS[Waterfall]
{
  // Removes the stock effect block, and replace it with one that has no particles
  !EFFECTS {}
	EFFECTS
	{		
		fx_running
		{			
			AUDIO
			{
				channel = Ship
				clip = sound_jet_deep
				volume = 0.0 0.0
				volume = 0.05 0.4
				volume = 1.0 1.5
				pitch = 0.0 0.3
				pitch = 1.0 0.5
				loop = true
			}				
		}
		fx_spool
		{
			AUDIO
			{
				channel = Ship
				clip = sound_jet_low
				volume = 0.0 0.0
				volume = 0.05 0.2
				volume = 1.0 0.45
				pitch = 0.0 0.3
				pitch = 0.05 0.5
				pitch = 1.0 0.65
				loop = true
			}
		}
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_medium
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		disengage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		flameout
		{
			PREFAB_PARTICLE
			{
				prefabName = fx_exhaustSparks_flameout_2
				transformName = thrustTransformFX
				oneShot = true
			}
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
	}
	
@MODULE[ModuleEngines*]
	{
	  %powerEffectName = fx_power
	  %spoolEffectName = fx_spool
	}
	
  MODULE
  {
	name = ModuleWaterfallFX
	moduleID = SC_FX
	CONTROLLER
	{
		name = atmosphereDepth
		linkedTo = atmosphere_density
	}
	CONTROLLER
	{
		name = throttle
		linkedTo = throttle
		engineID = Cruise
		responseRateUp = 0.02
		responseRateDown = 0.02
	}
	CONTROLLER
	{
		name = mach
		linkedTo = mach
	}
	TEMPLATE
    {
      templateName = stock-kerozine-turbofan-1
      overrideParentTransform = thrustTransform
	  position = 0,0,0
	  rotation = 0, 0, 0
	  scale = 0.7, 0.7, 0.7
    }
  }
}