// ========================================================== DCY ============
@PART[PROXI-DCY-body]:NEEDS[CommunityResourcePack]
{
	@mass = 14.31

	!RESOURCE[LiquidFuel]
    	{
	
    	}
    	@RESOURCE[Oxidizer]
    	{
		@amount = 17982
		@maxAmount = 17982
    	}
	RESOURCE
	{
		name = LqdHydrogen
		amount = 269730
		maxAmount = 269730
	}
	@MODULE[ModuleRCSFX]
	{
		!PROPELLANT,* {}
		@thrusterPower = 10.0
        	PROPELLANT
        	{
            	name = LqdHydrogen
            	ratio = 1.5
            	DrawGauge = True
        	}
        	PROPELLANT
        	{
            	name = Oxidizer
            	ratio = 0.1
        	}
		enableRoll = True
        	enableYaw = True
        	enablePitch = True
        	enableX = True
        	enableY = True
        	enableZ = True
		@atmosphereCurve
		{
			@key,0 = 0 300
			@key,1 = 1 100
		}
	}
}

