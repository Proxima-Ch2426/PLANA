		steeringAxis = 0, 0, 1
		steeringResponse = 10
	}
	MODULE
	{
		name = FXModuleConstrainPosition		// match rotation of the upper scissor link to the steered section
		matchRotation = true
		matchPosition = false
		CONSTRAINFX
		{
			targetName = s-SteeringPivot
			moversName = s-SteeringActuator
