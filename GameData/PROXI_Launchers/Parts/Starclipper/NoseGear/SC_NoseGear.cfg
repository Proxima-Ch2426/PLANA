	}
	MODULE
	{
		name = FXModuleLookAtConstraint			// scissor links
		CONSTRAINLOOKFX
		{
			targetName = AnchorLower
			rotatorsName = LinkUpper
		}
		CONSTRAINLOOKFX
		{
			targetName = AnchorUpper
			rotatorsName = LinkLower
		}
	}
	MODULE
	{
